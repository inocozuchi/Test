<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>無音カメラ</title>
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #fff; color: #000; overflow: hidden;
    font-family: -apple-system, sans-serif; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #home { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; overflow: auto;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); text-align: center; }
  /* 中身が画面より長いときに上が切れないよう、justify-content ではなく margin:auto で中央に置く */
  #homeInner { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 8px; }
  #info { font-size: 13px; color: #888; white-space: pre-line; line-height: 1.6; }
  #guide { font-size: 12px; color: #999; line-height: 1.7; white-space: pre-line; }
  select { font-size: 16px; color: #000; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 8px 10px; }
  #recBtn { width: 96px; height: 96px; border-radius: 50%; border: 0; background: #000; padding: 0; flex: none; }
  #recBtn:disabled { background: #bbb; }
  .btn { border: 0; border-radius: 999px; font-size: 15px; color: #fff; background: #000; padding: 12px 18px; }
  .btn:disabled { opacity: .4; }
  .btn.sub { background: #888; }
  .btn.small { font-size: 13px; padding: 8px 12px; }
  #err { color: #c22; font-size: 13px; }
  /* ホーム画面に追加して全画面で開いたときだけ、ステータスバー(白文字)の背後を黒にする。Safariのタブ内では出さない */
  #topcap { position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top); background: #000; z-index: 50; pointer-events: none; display: none; }
  html.standalone #topcap { display: block; }

  /* 端末内に残っている録画の一覧 */
  #stored { background: #f4f4f4; padding: 12px; border-radius: 12px; font-size: 13px; width: 100%; max-width: 360px; }
  #stored .title { font-weight: 600; margin-bottom: 8px; }
  .srow { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px solid #ddd; }
  .srow span { flex: 1; text-align: left; }

  /* 録画中の真っ黒画面 */
  /* 画面の端(ホームバーやSafariのツールバー周り)まで黒くするため、録画中はページ全体の背景も黒にする */
  html.recording, html.recording body { background: #000; }
  #black { position: fixed; top: 0; left: 0; width: 100vw; height: 100lvh; background: #000; display: none; z-index: 10; touch-action: none; }
  #blackMsg { position: absolute; left: 16px; right: 16px; top: 45%; text-align: center; color: #555; font-size: 14px; line-height: 1.7; white-space: pre-line; pointer-events: none; }
  #tapHint { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); color: #222; font-size: 14px; opacity: 0; transition: opacity .3s; }

  /* メモ画面(白背景) */
  #memo { position: fixed; inset: 0; background: #fff; color: #000; display: none; z-index: 20;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
    flex-direction: column; gap: 8px; -webkit-user-select: text; user-select: text; }
  #memo header { display: flex; gap: 8px; }
  #memo header .spacer { flex: 1; }
  #memo .btn.sub { background: #666; }
  #memoText { flex: 1; width: 100%; font-size: 17px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; color: #000; background: #fff; resize: none; }

  /* 写真・動画・資料ビューア(録画中に見る用)。表示領域は画面全体で、ボタンは上に重ねる。1回タップでボタンを隠す */
  #viewer { position: fixed; inset: 0; background: #000; color: #fff; display: none; z-index: 25; }
  #viewer header { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; gap: 6px; align-items: center;
    padding: calc(env(safe-area-inset-top) + 8px) 8px 16px; background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0)); transition: opacity .2s; }
  #viewer.bare header { opacity: 0; pointer-events: none; }
  #viewer header .spacer { flex: 1; text-align: center; font-size: 13px; color: #ccc; white-space: nowrap; overflow: hidden; }
  .vbtn { border: 0; border-radius: 999px; font-size: 14px; color: #fff; background: rgba(60,60,60,.85); padding: 9px 12px; white-space: nowrap; }
  .vbtn.on { background: #fff; color: #000; }
  /* 拡大・スクロールは自前で処理する(ブラウザ自体の拡大は止める) */
  #viewerBody { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; touch-action: pan-x pan-y; }
  #vContent { margin: auto; flex: none; }
  #vContent.pdf { padding: calc(env(safe-area-inset-top) + 60px) 0 env(safe-area-inset-bottom); }
  #vContent img, #vContent video { display: block; width: 100%; height: auto; }
  #vContent canvas { display: block; width: 100%; background: #fff; margin: 0 auto 8px; }
  #vContent.invert { filter: invert(1) hue-rotate(180deg); }
  #vStatus { text-align: center; font-size: 14px; color: #aaa; padding: 24px; white-space: pre-line; }

  /* 保存画面 */
  #result { position: fixed; inset: 0; background: #fff; display: none; z-index: 30; flex-direction: column;
    align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px); text-align: center; overflow: auto; }
  #result > * { flex: none; }
  #result .btn { width: 100%; max-width: 320px; }
  #result .btn.done { background: #2a7; }
  #files { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
  .fileBox { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; border: 1px solid #ddd; border-radius: 12px; }
  .fileBox .name { font-size: 13px; color: #555; }
  .note { font-size: 12px; color: #666; white-space: pre-wrap; text-align: left; }
  .rangeRow { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 13px; }
  .rangeRow input { flex: 1; }
  .rangeLabel { width: 2.5em; text-align: left; color: #555; }
  .rangeVal { width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }
  .nudges { display: flex; gap: 4px; width: 100%; justify-content: space-between; }
  .nudge { flex: 1; border: 1px solid #ccc; background: #fff; color: #333; border-radius: 8px; font-size: 12px; padding: 6px 0; }
  .previews { display: flex; gap: 8px; width: 100%; }
  .previews video { flex: 1; min-width: 0; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; object-fit: contain; }
  .sel { font-size: 13px; color: #333; }
  .pieces { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .pieces .btn { width: 100%; }
  .prog { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .bar { height: 8px; background: #e5e5e5; border-radius: 4px; overflow: hidden; }
  .barIn { height: 100%; width: 0; background: #2a7; transition: width .3s; }
  .progText { font-size: 12px; color: #444; white-space: pre-wrap; }
  #msg { font-size: 14px; color: #444; white-space: pre-wrap; margin-top: auto; }
  #saveErr { font-size: 13px; color: #c22; white-space: pre-wrap; }
  #resultEnd { margin-bottom: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

  /* 読み込み中の表示 */
  #busy { position: fixed; inset: 0; z-index: 60; background: rgba(255,255,255,.92); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; font-size: 15px; color: #333; white-space: pre-line; }
  .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #000; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="topcap"></div>
<div id="home">
  <div id="info"></div>
  <div id="homeInner">
  <div id="stored" hidden>
    <div class="title">端末内に残っている録画</div>
    <div id="storedList"></div>
  </div>
  <select id="quality" aria-label="画質">
    <option value="auto">自動(最高画質)</option>
    <option value="3840x2160@60">4K 60fps</option>
    <option value="1920x1080@60">1080p 60fps(滑らか・発熱少なめ)</option>
    <option value="3840x2160@30">4K 30fps(高精細・発熱大きめ)</option>
    <option value="1920x1080@30">1080p 30fps</option>
  </select>
  <select id="lens" aria-label="レンズ">
    <option value="wide">レンズ: 標準(1x)</option>
    <option value="ultra">レンズ: 超広角(0.5x)</option>
    <option value="tele">レンズ: 望遠(ある機種のみ)</option>
  </select>
  <select id="size" aria-label="容量">
    <option value="std">データ量: 標準</option>
    <option value="high">データ量: 多め(動きの多い場面でも細部が崩れにくい)</option>
    <option value="save">データ量: 少なめ(画質は下がります)</option>
  </select>
  <button id="recBtn" aria-label="録画開始"></button>
  <div id="err"></div>
  <div id="guide">録画中は画面が真っ黒になります
5回タップ: メモ ・ 10回タップ: 停止
横向きで撮るときは、画面の向きのロックを解除してください</div>
  </div>
</div>

<div id="black"><div id="blackMsg"></div><div id="tapHint"></div></div>

<div id="memo">
  <header>
    <button class="btn sub" id="openViewer">写真・資料を見る</button>
    <button class="btn sub" id="resumeViewer" hidden>続きを見る</button>
    <span class="spacer"></span>
    <button class="btn" id="memoBack">戻る</button>
  </header>
  <textarea id="memoText" placeholder="メモを入力(自動で保存されます)"></textarea>
</div>

<input type="file" id="pick" accept="image/*,video/*,application/pdf" style="position:fixed;left:-9999px;opacity:0">

<div id="viewer">
  <div id="viewerBody"><div id="vContent"></div></div>
  <header>
    <button class="vbtn" id="viewerBack">戻る</button>
    <span class="spacer" id="vPage"></span>
    <button class="vbtn" id="vInvert">白黒反転</button>
    <button class="vbtn" id="vFit">全体</button>
    <button class="vbtn" id="viewerPick">開く</button>
  </header>
</div>

<div id="result">
  <div id="msg"></div>
  <div id="files"></div>
  <div id="saveErr"></div>
  <div id="resultEnd">
    <button class="btn sub" id="saveMemo">メモを保存</button>
    <button class="btn" id="deleteAndBack" style="background:#c33">保存できたので削除して戻る</button>
    <button class="btn sub" id="keepAndBack">残したまま戻る</button>
    <button class="btn sub" id="recAgain">残したまま、続けて録画する</button>
  </div>
</div>

<video id="awake" muted playsinline style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none"></video>

<div id="busy"><div class="spinner"></div><div id="busyText"></div></div>

<script src="mp4split.js"></script>
<script>
const $ = id => document.getElementById(id);
let stream = null, wakeLock = null;
let session = null;  // 録画中の状態
let rec = null;      // いま動いている MediaRecorder
let cur = null;      // 録画のメタ情報(端末内DBにも保存)
let files = [];      // 保存画面に出すファイル

if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');

function busy(text) {
  $('busyText').textContent = text || '';
  $('busy').style.display = text ? 'flex' : 'none';
}

// ---------- カメラ(プレビューは表示しない) ----------
// 実機の結果: 1080p60は約60fpsで安定。4K30は環境によって約20fpsに落ちることがあるため、60fps出せる設定を優先する
const CANDIDATES = [[3840, 2160, 60], [1920, 1080, 60], [3840, 2160, 30], [1920, 1080, 30], [1280, 720, 30]];

function fmtSettings() {
  const s = stream.getVideoTracks()[0].getSettings();
  return { w: s.width, h: s.height, fps: Math.round(s.frameRate || 0) };
}

function stopStream() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}

// ---- レンズ ----
// 「背面カメラ」とだけ指定すると、iPhoneは超広角や、レンズを自動で切り替える仮想カメラを選ぶことがある。
// 遠くの文字までくっきり写すため、標準の広角レンズ(1x)を名前で探して指定する
const LENS = { wide: /^(Back Camera|背面カメラ)$/i, ultra: /(Ultra Wide|超広角)/i, tele: /(Telephoto|望遠)/i };
let lensIds = null;
async function findLenses() {
  if (lensIds) return lensIds;
  let devs = await navigator.mediaDevices.enumerateDevices();
  if (!devs.some(d => d.kind === 'videoinput' && d.label)) {
    // カメラ名はカメラを一度使ったあとでないと読めないので、一瞬だけ開いて閉じる
    const st = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' } } });
    st.getTracks().forEach(t => t.stop());
    devs = await navigator.mediaDevices.enumerateDevices();
  }
  const vids = devs.filter(d => d.kind === 'videoinput');
  lensIds = {};
  for (const [k, re] of Object.entries(LENS)) {
    const d = vids.find(v => re.test(v.label) && !/(Dual|Triple|デュアル|トリプル|Front|前面)/i.test(v.label));
    if (d) lensIds[k] = d.deviceId;
  }
  return lensIds;
}
let lensId = null;  // 今回使うレンズ(見つからなければ「背面カメラ」とだけ指定)

function videoConstraints(w, h, fps, strictFps) {
  return { ...(lensId ? { deviceId: { exact: lensId } } : { facingMode: { ideal: 'environment' } }),
           width: { ideal: w }, height: { ideal: h }, frameRate: strictFps ? { min: fps - 1, ideal: fps } : { ideal: fps } };
}

// frameRate を min で指定し、そのフレームレートを出せない場合は失敗させる
async function tryOpen(w, h, fps) {
  stopStream();
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: videoConstraints(w, h, fps, true) });
  const s = fmtSettings();
  return Math.max(s.w, s.h) >= w;
}

// 自動: 4K60から順に試し、解像度とフレームレートの両方を満たした最初の設定を使う。手動: 選んだ設定だけ試す
// 自動で決まった設定は覚えておき、次回はそこから試す(使えない設定を毎回試さないので起動が速い)
// prefer: 録画の自動再開のときは、最初と同じ設定を真っ先に試す(再開で画質が変わらないように)
async function openCamera(prefer) {
  const v = $('quality').value;
  let list = v === 'auto' ? CANDIDATES : [v.split(/[x@]/).map(Number)];
  // 自動のとき、前回4K60が使えなかったなら次の候補から試す(起動を速くする)。
  // それより下の画質は覚えない: 一時的に開けなかっただけで、ずっと低い画質になってしまうため
  if (v === 'auto' && store.get('autoIndex') !== null && Number(store.get('autoIndex')) >= 1) list = CANDIDATES.slice(1);
  if (prefer) list = [prefer, ...list.filter(c => c.join() !== prefer.join())];
  for (const [w, h, fps] of list) {
    try {
      if (await tryOpen(w, h, fps)) {
        if (v === 'auto' && !prefer) store.set('autoIndex', Math.min(1, CANDIDATES.findIndex(c => c[0] === w && c[2] === fps)));
        return true;
      }
    } catch (e) {}
  }
  stopStream();
  const [w, h, fps] = list[0];
  stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: videoConstraints(w, h, fps, false) });
  return v === 'auto';
}

// 録画ボタンを押した時にだけカメラを起動する(待機中は電池を使わない)
async function prepareCamera(prefer) {
  try { lensId = (await findLenses())[$('lens').value] || null; } catch (e) { lensId = null; }
  let ok;
  try {
    ok = await openCamera(prefer);
  } catch (e) {
    if (!lensId) throw e;
    lensId = null;  // 指定したレンズで開けなければ、いつもの「背面カメラ」で開く
    ok = await openCamera(prefer);
  }
  // ライト(トーチ)は明示的に消灯しておく
  await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
  const s = fmtSettings();
  const label = stream.getVideoTracks()[0].label;
  let text = `${Math.max(s.w, s.h)}×${Math.min(s.w, s.h)} ${s.fps}fps${ok ? '' : '(選んだ設定は使えませんでした)'}${label ? ` ・ ${label}` : ''}`;
  const c = stream.getVideoTracks()[0].getCapabilities?.();
  if (c && c.exposureCompensation) {
    // 流れる景色のブレ対策: 露出を少し下げてシャッター速度を稼ぐ(対応していれば)
    const ev = Math.max(c.exposureCompensation.min, -0.7);
    await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ exposureCompensation: ev }] }).catch(() => {});
  }
  return text;
}
// 設定の保存(使えない環境では何もしない)
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};
if (store.get('quality')) $('quality').value = store.get('quality');
$('quality').onchange = () => { store.set('quality', $('quality').value); showHomeInfo(); };
if (store.get('lens')) $('lens').value = store.get('lens');
$('lens').onchange = () => store.set('lens', $('lens').value);
if (store.get('size')) $('size').value = store.get('size');
$('size').onchange = () => { store.set('size', $('size').value); showHomeInfo(); };

// ホーム上部: 空き容量と、選んだ画質で録画できるおおよその時間
function expectedMode() {
  const v = $('quality').value;
  if (v !== 'auto') return v.split(/[x@]/).map(Number);
  const i = store.get('autoIndex');
  return CANDIDATES[i === null ? 1 : Number(i)] || CANDIDATES[1];  // 未確定なら1080p60と見なす
}
async function showHomeInfo() {
  let text = '';
  try {
    const est = await navigator.storage.estimate();
    const free = est.quota - est.usage;
    if (free > 0 && free < 1e13) {
      const min = Math.floor(free * 8 / (mbpsFor(...expectedMode()) * 1e6) / 60);
      text = `保存できる空き: ${fmtSize(free)}(この画質で約${min >= 120 ? `${Math.floor(min / 60)}時間` : `${min}分`})`;
    }
  } catch (e) {}
  if (!('wakeLock' in navigator)) text += (text ? '\n' : '') + '※この端末では自動ロックを止められません。設定で自動ロックを「なし」にしてください';
  $('info').textContent = text;
}
// 長時間録画中にブラウザが端末内データを消さないよう、永続化を要求
navigator.storage?.persist?.().catch(() => {});

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

// "20261006-213925" → "10/6 21:39"
function sidLabel(sid) {
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(sid);
  return m ? `${+m[2]}/${+m[3]} ${m[4]}:${m[5]}` : sid;
}

function fmtDur(sec) {
  if (!(sec > 0)) return '';
  return sec < 60 ? `${Math.round(sec)}秒` : sec < 3600 ? `約${Math.round(sec / 60)}分` : `約${Math.floor(sec / 3600)}時間${Math.round(sec % 3600 / 60)}分`;
}

// 録画時間: 終了時刻があればそれを使い、途中で終わった録画は書き込み回数(1秒ごと)から見積もる
function recDuration(meta, chunkCount) {
  return meta.start && meta.end ? (meta.end - meta.start) / 1000 : chunkCount;
}

function fmtSize(bytes) {
  return bytes >= 1e9 ? `${(bytes / 1e9).toFixed(2)} GB` : `${(bytes / 1e6).toFixed(1)} MB`;
}

// ---------- 録画データの保存先(端末内DB) ----------
// 1秒ごとに書き込むので、アプリが落ちても次回起動時にそこまでの録画を復元できる。
// キーは「録画ID:パート番号:連番」。古い版の「録画ID:連番」も読めるようにしている。
// 録画データは、利用者が「削除」を押すまで消さない。
const dbReady = new Promise((res, rej) => {
  const r = indexedDB.open('silentcam', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('chunks'); r.result.createObjectStore('meta'); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});

async function dbDo(store, mode, fn) {
  const db = await dbReady;
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result);
    t.onerror = t.onabort = () => rej(t.error);
  });
}

const rangeOf = prefix => IDBKeyRange.bound(`${prefix}:`, `${prefix}:￿`);

async function deleteRecording(sid) {
  await dbDo('chunks', 'readwrite', s => s.delete(rangeOf(sid)));
  await dbDo('meta', 'readwrite', s => s.delete(sid));
}

// ---------- 録画 ----------
// 1秒あたりのデータ量(Mbps)の指定値。1時間あたりの容量 ≒ Mbps × 0.45 GB。
// Safariは指定より少なめ(実測で約7割)に記録し、車窓のように画面全体が動く映像はデータ量が足りないと
// ブロック状に崩れやすい。そのため「標準」も純正カメラより多めにしている(4K30の標準で1時間約27GB)
const MBPS_TABLE = {
  '4k60':  { high: 100, std: 80, save: 40 },
  '4k30':  { high: 80, std: 60, save: 30 },
  '1080p60': { high: 45, std: 32, save: 18 },
  '1080p30': { high: 30, std: 16, save: 10 },
  '720p30': { high: 15, std: 8, save: 5 },
};
function modeKey(w, h, fps) {
  const long = Math.max(w, h);
  return long >= 3000 ? (fps > 45 ? '4k60' : '4k30') : long >= 1800 ? (fps > 45 ? '1080p60' : '1080p30') : '720p30';
}
function mbpsFor(w, h, fps) {
  return MBPS_TABLE[modeKey(w, h, fps)][$('size').value] || 27;
}
function bitrate() {
  const s = fmtSettings();
  return Math.round(mbpsFor(s.w, s.h, s.fps) * 1e6);
}

$('recBtn').onclick = () => startRecording();

function pickMime() {
  return ['video/mp4;codecs=hvc1', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
}

// 録画を始める。resume を渡すと、途中で止まった録画の続き(次のパート)として記録する
async function startRecording(resume) {
  $('err').textContent = '';
  $('recBtn').disabled = true;
  $('info').textContent = resume ? '中断された録画を再開しています...' : 'カメラ起動中...';
  let camInfo;
  try {
    camInfo = await prepareCamera();
  } catch (e) {
    stopStream();
    showHomeInfo();
    $('err').textContent = e.name === 'NotAllowedError'
      ? 'カメラの使用が許可されていません。\n設定 → アプリ → Safari → カメラ を「許可」にして、ページを開き直してください。'
      : `カメラを起動できません: ${e.name} ${e.message}`;
    $('recBtn').disabled = false;
    return false;
  }
  $('recBtn').disabled = false;
  showHomeInfo();

  const mime = pickMime();
  if (resume) {
    cur = resume.meta;
    $('memoText').value = cur.memo || '';
  } else {
    const sid = stamp();
    cur = { sid, base: `video-${sid}`, ext: mime.includes('webm') ? 'webm' : 'mp4', mime, memo: '', info: camInfo, start: Date.now() };
    $('memoText').value = '';
  }
  const ss = session = { sid: cur.sid, mime, active: true, finalized: false, part: resume ? resume.nextPart - 1 : -1,
                         useMem: false, mem: [], chain: Promise.resolve(), recovering: false, retryTimer: null,
                         lastData: Date.now(), dog: null, mode: null };
  { const st = fmtSettings(); ss.mode = [Math.max(st.w, st.h), Math.min(st.w, st.h), st.fps]; }
  // 端末内DBが最初から使えない場合だけメモリに溜める
  ss.chain = dbDo('meta', 'readwrite', st => st.put(cur, cur.sid)).catch(() => { ss.useMem = true; });
  try {
    startPart(ss);
  } catch (e) {
    session = null;
    stopStream();
    $('err').textContent = `録画を開始できません: ${e.name} ${e.message}`;
    return false;
  }
  enterBlack();
  keepAwake();
  startWatchdog(ss);
  return true;
}

// MediaRecorder を1つ動かす。カメラや録画が途中で止まったら、同じ録画の次のパートとして録り直す
function startPart(ss) {
  const r = new MediaRecorder(stream, { mimeType: ss.mime || undefined, videoBitsPerSecond: bitrate() });
  ss.part++;
  const pp = String(ss.part).padStart(3, '0');
  let idx = 0;
  if (r.mimeType) cur.mime = r.mimeType;
  { const st = fmtSettings(); cur.partInfo = { ...(cur.partInfo || {}), [pp]: `${Math.max(st.w, st.h)}×${Math.min(st.w, st.h)} ${st.fps}fps` }; }
  r.ondataavailable = e => {
    if (!e.data.size) return;
    ss.lastData = Date.now();
    const key = `${ss.sid}:${pp}:${String(idx++).padStart(8, '0')}`;
    const data = e.data;
    ss.chain = ss.chain.then(() => ss.useMem ? ss.mem.push({ key, data })
      : dbDo('chunks', 'readwrite', st => st.put(data, key)).catch(() => {
          cur.note = '端末の空き容量が足りなくなったため、録画を停止しました。';
          stopRecording();
        }));
  };
  // 停止操作なら保存画面へ。それ以外(エラーやカメラの停止)で止まったら録画を再開する
  r.onstop = () => {
    if (!ss.active) finalize(ss);
    else if (cameraEnded()) onCameraEnded(ss);
    else recoverCapture(ss);
  };
  stream.getVideoTracks()[0].onended = () => onCameraEnded(ss);
  rec = r;
  ss.lastData = Date.now();
  r.start(1000);
}

function cameraEnded() {
  const t = stream && stream.getVideoTracks()[0];
  return !t || t.readyState === 'ended';
}

// 録画中の黒い画面に出す控えめなお知らせ
function blackMsg(text) {
  $('blackMsg').textContent = text || '';
}

// 画面を見ているときにカメラが止まった(iOSの「カメラ収録を停止」でOKを押した、発熱、着信など)。
// 10秒待ってから自動で録画を再開する。本当に終えたいときは、その間に10回タップで保存できる
function onCameraEnded(ss) {
  if (!ss.active || ss.retryTimer || ss.recovering) return;
  if (document.hidden) return;  // 画面に戻ったときに再開する
  blackMsg('カメラが止まりました。10秒後に録画を再開します\n(終えるときは10回タップ)');
  ss.retryTimer = setTimeout(() => { ss.retryTimer = null; recoverCapture(ss); }, 10000);
}

// 録画を新しいパートとして再開する。カメラが開けなければ、5秒ごとに再挑戦し続ける
async function recoverCapture(ss) {
  if (!ss.active || ss.recovering || document.hidden) return;
  clearTimeout(ss.retryTimer);
  ss.retryTimer = null;
  ss.recovering = true;
  try {
    // まだ動いている(けれど止まっている)録画は切り離して止める。最後の分は書き込まれる
    if (rec && rec.state !== 'inactive') { rec.onstop = null; try { rec.stop(); } catch (e) {} }
    if (cameraEnded()) {
      await prepareCamera(ss.mode);
      if (!ss.active) { stopStream(); return; }  // 待っている間に停止操作された
    }
    startPart(ss);
    blackMsg('');
    keepAwake();
  } catch (e) {
    if (ss.active) {
      blackMsg('カメラを再開できません。再試行しています...\n(終えるときは10回タップ)');
      ss.retryTimer = setTimeout(() => { ss.retryTimer = null; recoverCapture(ss); }, 5000);
    }
  } finally {
    ss.recovering = false;
  }
}

// 見張り役: 5秒ごとに録画が続いているかを確かめ、止まっていれば再開する。
// あわせて「録画中」の印を残し、アプリが落ちて開き直したときに自動で再開できるようにする
function startWatchdog(ss) {
  const beat = () => store.set('recHeartbeat', JSON.stringify({ sid: ss.sid, t: Date.now() }));
  beat();
  ss.dog = setInterval(() => {
    if (!ss.active) { clearInterval(ss.dog); return; }
    beat();
    if (document.hidden || ss.recovering || ss.retryTimer) return;
    if (cameraEnded()) onCameraEnded(ss);
    else if (!rec || rec.state === 'inactive' || Date.now() - ss.lastData > 15000) recoverCapture(ss);
  }, 5000);
}

// 録画中は自動ロックさせない(ロックされるとiOSがカメラを止めてしまう)
async function keepAwake() {
  if (document.hidden) return;
  try {
    if (!wakeLock || wakeLock.released) {
      wakeLock = await navigator.wakeLock.request('screen');
      // iOSが勝手に解除したら(低電力モードなど)、すぐに取り直す
      wakeLock.addEventListener('release', () => { if (session && session.active && !document.hidden) keepAwake(); });
    }
    return;
  } catch (e) {}
  // 使えない場合の代わり: 見えない小さな動画を再生し続ける
  const v = $('awake');
  v.srcObject = stream;
  v.play().catch(() => {});
}

function releaseAwake() {
  const l = wakeLock;
  wakeLock = null;
  if (l) l.release().catch(() => {});
  $('awake').srcObject = null;
}

// 画面ごとにページ背景とテーマ色(Safariのバー色)を切り替える。メモ・保存・ホームは白、録画中は黒
function setTheme(dark) {
  document.documentElement.classList.toggle('recording', dark);
  document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#000000' : '#ffffff');
}

function stopRecording() {
  const ss = session;
  if (!ss || !ss.active) return;
  ss.active = false;
  clearInterval(ss.dog);
  clearTimeout(ss.retryTimer);
  store.set('recHeartbeat', '');
  blackMsg('');
  closeViewer(true);
  setTheme(false);
  $('black').style.display = 'none';
  $('memo').style.display = 'none';
  releaseAwake();
  // 固まって見えないよう、すぐに「確定中」を出す
  busy('録画を確定しています...');
  if (rec && rec.state !== 'inactive') rec.stop(); else finalize(ss);
}

async function finalize(ss) {
  if (ss.finalized) return;
  ss.finalized = true;
  await new Promise(r => setTimeout(r, 300));  // 止めた録画の最後の分が届くのを待つ
  await ss.chain;
  stopStream();  // 保存画面ではカメラを止めて、電池と発熱を節約する
  if (session === ss) session = null;
  // 最後に入力したメモと録画時間を確実に残す
  clearTimeout(memoTimer);
  cur.memo = $('memoText').value;
  cur.end = Date.now();
  await dbDo('meta', 'readwrite', st => st.put(cur, cur.sid)).catch(() => {});
  await openSaveScreen(cur, ss.mem);
}

// 画面を離れても(ロック・他のアプリ・通知)録画は止めない。
// 離れる直前に最新分を端末内へ書き出し、戻ってきたらカメラが止まっていれば自動で再開する
document.addEventListener('visibilitychange', () => {
  const ss = session;
  if (!ss || !ss.active) return;
  if (document.hidden) {
    try { if (rec && rec.state === 'recording') rec.requestData(); } catch (e) {}
    return;
  }
  keepAwake();
  if (cameraEnded() || !rec || rec.state === 'inactive') recoverCapture(ss);
  else ss.lastData = Date.now();  // 離れていた間は止まっていて当然なので、見張りの計測をやり直す
});

window.addEventListener('pagehide', () => {
  try { if (rec && rec.state === 'recording') rec.requestData(); } catch (e) {}
});

// アプリが落ちて開き直した(1分以内)なら、止まった録画の続きを自動で録り始める
async function resumeIfInterrupted() {
  let hb = null;
  try { hb = JSON.parse(store.get('recHeartbeat') || 'null'); } catch (e) {}
  if (!hb || Date.now() - hb.t > 60000) return false;
  store.set('recHeartbeat', '');
  const meta = await dbDo('meta', 'readonly', s => s.get(hb.sid)).catch(() => null);
  if (!meta || meta.end) return false;
  const keys = await dbDo('chunks', 'readonly', s => s.getAllKeys(rangeOf(hb.sid))).catch(() => []);
  if (keys.some(k => k.split(':').length !== 3)) return false;  // 古い版の録画は続きにしない
  const nums = keys.map(k => Number(k.split(':')[1]));
  return startRecording({ meta, nextPart: nums.length ? Math.max(...nums) + 1 : 0 });
}

// ---------- 真っ黒画面: 5回タップでメモ / 10回タップで停止 ----------
let taps = 0, tapTimer = null, hintTimer = null;

function enterBlack() {
  setTheme(true);
  $('memo').style.display = 'none';
  $('black').style.display = 'block';
}

$('black').addEventListener('pointerdown', e => {
  e.preventDefault();
  taps++;
  const hint = $('tapHint');
  hint.textContent = taps;
  hint.style.opacity = 1;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.style.opacity = 0, 600);
  clearTimeout(tapTimer);
  if (taps >= 10) { taps = 0; stopRecording(); return; }
  // 連続タップが途切れてから判定(10回の途中で5回目に反応しないように)
  tapTimer = setTimeout(() => {
    if (taps >= 5) openMemo();
    taps = 0;
  }, 800);
});

function openMemo() {
  setTheme(false);
  $('black').style.display = 'none';
  $('resumeViewer').hidden = !viewer.file;
  $('memo').style.display = 'flex';
  const t = $('memoText');
  t.focus();
  t.setSelectionRange(t.value.length, t.value.length);
}

$('memoBack').onclick = () => { $('memoText').blur(); enterBlack(); };

// メモは入力のたびに端末内へ保存(アプリが落ちても残る)
let memoTimer = null;
$('memoText').addEventListener('input', () => {
  if (!cur) return;
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => {
    cur.memo = $('memoText').value;
    dbDo('meta', 'readwrite', s => s.put(cur, cur.sid)).catch(() => {});
  }, 400);
});

// ---------- 録画中に写真・動画・資料(PDF)を見る ----------
// 画面全体に表示。2本指で拡大縮小、ダブルタップで画面いっぱいに拡大/元に戻す、1回タップでボタンを隠す/出す
const viewer = { file: null, url: null, kind: null, zoom: 1, pages: [], io: null, doc: null, aspect: 1, invert: false };
const vBody = $('viewerBody'), vContent = $('vContent');

$('openViewer').onclick = () => $('pick').click();
$('viewerPick').onclick = () => $('pick').click();
$('resumeViewer').onclick = () => showViewer();
$('viewerBack').onclick = () => { closeViewer(false); enterBlack(); };
$('vFit').onclick = () => { setZoom(1); refreshPdf(); };
$('vInvert').onclick = () => {
  viewer.invert = !viewer.invert;
  vContent.classList.toggle('invert', viewer.invert);
  $('vInvert').classList.toggle('on', viewer.invert);
};

let hintShown = false;
function showViewer() {
  if (!hintShown) {
    hintShown = true;
    $('vPage').textContent = '1回タップ: ボタンを隠す ・ ダブルタップ: 拡大';
    setTimeout(() => { if (viewer.kind !== 'pdf') $('vPage').textContent = ''; else updatePageNo(); }, 3000);
  }
  setTheme(true);
  $('memo').style.display = 'none';
  $('black').style.display = 'none';
  $('viewer').classList.remove('bare');
  $('viewer').style.display = 'block';
  layoutViewer();
}

// 閉じても読み込んだファイルと表示位置は残す(メモ画面の「続きを見る」で戻れる)。録画終了時は解放する
function closeViewer(release) {
  const v = vContent.querySelector('video');
  if (v) v.pause();
  $('viewer').style.display = 'none';
  if (release) unloadMedia();
}

function unloadMedia() {
  const v = vContent.querySelector('video');
  if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
  if (viewer.io) viewer.io.disconnect();
  for (const pg of viewer.pages) { if (pg.task) pg.task.cancel(); pg.canvas.width = pg.canvas.height = 0; }
  if (viewer.doc) viewer.doc.destroy();
  vContent.replaceChildren();
  vContent.classList.remove('pdf');
  if (viewer.url) URL.revokeObjectURL(viewer.url);
  Object.assign(viewer, { file: null, url: null, kind: null, zoom: 1, pages: [], io: null, doc: null, aspect: 1 });
  vContent.style.width = '';
  $('vPage').textContent = '';
}

$('pick').onchange = async () => {
  const f = $('pick').files[0];
  $('pick').value = '';
  if (!f) return;
  unloadMedia();
  viewer.file = f;
  showViewer();
  const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  const isVideo = !isPdf && (f.type.startsWith('video') || /\.(mov|mp4|m4v|webm)$/i.test(f.name));
  try {
    if (isPdf) await openPdf(f);
    else openMedia(f, isVideo);
  } catch (e) {
    if (viewer.file !== f) return;
    const msg = document.createElement('div');
    msg.id = 'vStatus';
    msg.textContent = `開けませんでした: ${e.message || e.name}`;
    vContent.replaceChildren(msg);
  }
};

function openMedia(f, isVideo) {
  viewer.kind = isVideo ? 'video' : 'image';
  viewer.url = URL.createObjectURL(f);
  const el = document.createElement(isVideo ? 'video' : 'img');
  if (isVideo) {
    el.controls = true; el.playsInline = true; el.muted = true;  // 音は初期状態でミュート
    el.onloadedmetadata = () => { viewer.aspect = el.videoWidth / el.videoHeight || 1; layoutViewer(); };
  } else {
    el.onload = () => { viewer.aspect = el.naturalWidth / el.naturalHeight || 1; layoutViewer(); };
  }
  el.src = viewer.url;
  vContent.replaceChildren(el);
}

// ---- PDF(同梱の pdf.js を必要なときだけ読み込む。圏外でも表示できる) ----
const PDFJS = 'vendor/pdfjs/';
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PDFJS + 'pdf.min.js';
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(); };
    s.onerror = () => { s.remove(); rej(new Error('PDF表示用のプログラムを読み込めませんでした')); };
    document.head.append(s);
  });
}

async function openPdf(f) {
  viewer.kind = 'pdf';
  vContent.classList.add('pdf');
  const status = document.createElement('div');
  status.id = 'vStatus'; status.textContent = '読み込み中...';
  vContent.replaceChildren(status);
  await loadPdfJs();
  const doc = await pdfjsLib.getDocument({
    data: new Uint8Array(await f.arrayBuffer()),
    cMapUrl: PDFJS + 'cmaps/', cMapPacked: true,          // 日本語フォントの表示に必要
    standardFontDataUrl: PDFJS + 'standard_fonts/',
  }).promise;
  if (viewer.file !== f) { doc.destroy(); return; }
  viewer.doc = doc;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    if (viewer.file !== f) return;
    const vp1 = page.getViewport({ scale: 1 });
    const canvas = document.createElement('canvas');
    canvas.style.aspectRatio = `${vp1.width} / ${vp1.height}`;
    canvas.width = canvas.height = 0;
    pages.push({ n: i, page, vp1, canvas, renderedW: 0, task: null, visible: false });
  }
  viewer.pages = pages;
  vContent.replaceChildren(...pages.map(pg => pg.canvas));
  viewer.aspect = pages[0].vp1.width / pages[0].vp1.height;
  layoutViewer();
  // 見えているページの近くだけ描画し、離れたページは解放する(メモリ節約)
  viewer.io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const pg = viewer.pages.find(p => p.canvas === e.target);
      if (!pg) continue;
      pg.visible = e.isIntersecting;
      if (pg.visible) renderPage(pg); else releasePage(pg);
    }
    updatePageNo();
  }, { root: vBody, rootMargin: '100% 0px' });
  pages.forEach(pg => viewer.io.observe(pg.canvas));
}

function renderPage(pg) {
  const cssW = pg.canvas.clientWidth || vBody.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  const aspect = pg.vp1.width / pg.vp1.height;
  // 表示の大きさに合わせた解像度で描く。1ページあたりの画素数に上限を設ける
  const target = Math.round(Math.min(cssW * dpr, 4096, Math.sqrt(12e6 * aspect)));
  if (pg.renderedW && Math.abs(pg.renderedW - target) / target < 0.25) return;
  if (pg.task) pg.task.cancel();
  const vp = pg.page.getViewport({ scale: target / pg.vp1.width });
  pg.canvas.width = Math.round(vp.width);
  pg.canvas.height = Math.round(vp.height);
  pg.renderedW = target;
  const task = pg.task = pg.page.render({ canvasContext: pg.canvas.getContext('2d'), viewport: vp });
  task.promise.then(() => { if (pg.task === task) pg.task = null; }, () => { if (pg.task === task) pg.task = null; });
}

function releasePage(pg) {
  if (pg.task) { pg.task.cancel(); pg.task = null; }
  pg.canvas.width = pg.canvas.height = 0;
  pg.renderedW = 0;
}

let refreshTimer = null;
function refreshPdf() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => viewer.pages.forEach(pg => pg.visible && renderPage(pg)), 150);
}

function updatePageNo() {
  if (viewer.kind !== 'pdf' || !viewer.pages.length) return;
  const line = vBody.getBoundingClientRect().top + vBody.clientHeight / 3;
  let n = 1;
  for (const pg of viewer.pages) if (pg.canvas.getBoundingClientRect().top <= line) n = pg.n;
  $('vPage').textContent = `${n} / ${viewer.pages.length}`;
}
vBody.addEventListener('scroll', updatePageNo, { passive: true });

// ---- 拡大・縮小 ----
// 等倍は「画面全体に収まる大きさ」。資料(PDF)は横幅に合わせる
function baseWidth() {
  const W = vBody.clientWidth, H = vBody.clientHeight;
  if (viewer.kind === 'pdf') return W;
  return Math.min(W, H * (viewer.aspect || 1));
}

// ダブルタップの拡大先: 写真は「画面いっぱい(余白なし)」、資料は2.5倍
function fillZoom() {
  if (viewer.kind === 'pdf') return 2.5;
  const W = vBody.clientWidth, H = vBody.clientHeight, a = viewer.aspect || 1;
  const z = Math.max(W, H * a) / Math.min(W, H * a);
  return z > 1.2 ? z : 2.5;
}

function layoutViewer() {
  vContent.style.width = viewer.file ? `${baseWidth() * viewer.zoom}px` : '';
}
window.addEventListener('resize', () => { if (viewer.file) { layoutViewer(); refreshPdf(); } });

// (cx, cy) の位置を固定したまま倍率を変える
function setZoom(z, cx, cy) {
  z = Math.max(1, Math.min(8, z));
  const r = vBody.getBoundingClientRect();
  const px = cx == null ? vBody.clientWidth / 2 : cx - r.left;
  const py = cy == null ? vBody.clientHeight / 2 : cy - r.top;
  const ux = (vBody.scrollLeft + px - vContent.offsetLeft) / viewer.zoom;
  const uy = (vBody.scrollTop + py - vContent.offsetTop) / viewer.zoom;
  viewer.zoom = z;
  layoutViewer();
  vBody.scrollLeft = ux * z + vContent.offsetLeft - px;
  vBody.scrollTop = uy * z + vContent.offsetTop - py;
}

let pinch = null, lastTap = null, moved = false, singleTapTimer = null;
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
vBody.addEventListener('touchstart', e => {
  if (e.touches.length === 1) moved = false;
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinch = { d: dist(a, b), z: viewer.zoom };
    lastTap = null;
    clearTimeout(singleTapTimer);
    e.preventDefault();
  }
}, { passive: false });
vBody.addEventListener('touchmove', e => {
  moved = true;
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const [a, b] = e.touches;
    setZoom(pinch.z * dist(a, b) / pinch.d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
  } else lastTap = null;
}, { passive: false });
vBody.addEventListener('touchend', e => {
  if (pinch) { if (e.touches.length < 2) { pinch = null; refreshPdf(); } return; }
  if (e.touches.length || e.changedTouches.length !== 1 || moved) return;
  const t = e.changedTouches[0], now = Date.now();
  if (viewer.kind !== 'video' && lastTap && now - lastTap.t < 300 && Math.hypot(t.clientX - lastTap.x, t.clientY - lastTap.y) < 30) {
    // ダブルタップ: 拡大中なら元に戻す。等倍なら画面いっぱいに拡大
    e.preventDefault();
    clearTimeout(singleTapTimer);
    setZoom(viewer.zoom > 1.05 ? 1 : fillZoom(), t.clientX, t.clientY);
    refreshPdf();
    lastTap = null;
    return;
  }
  lastTap = { t: now, x: t.clientX, y: t.clientY };
  // 1回タップ: ボタンを隠す/出す(全画面表示)
  clearTimeout(singleTapTimer);
  singleTapTimer = setTimeout(() => $('viewer').classList.toggle('bare'), 300);
});
// iOSでページ全体が拡大されるのを防ぐ
document.addEventListener('gesturestart', e => e.preventDefault());

// ---------- 保存 ----------
// iPhoneのSafariは、共有メニューに渡す動画をいったん全部メモリに読み込む。
// 大きな動画を渡すとページごと落ちるため、写真アプリへの保存は約300MBずつに分けて渡す。
// 録画は「短い区切りの連続」なので、区切り単位で好きな区間を切り出し、単独で再生できる動画に作り直せる(mp4split.js)。
const SHARE_LIMIT = 300e6;
const isChromeIOS = /CriOS/.test(navigator.userAgent);

// 秒 → "1:02:03" / "2:03"
function fmtTime(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s2 = String(sec % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${s2}` : `${m}:${s2}`;
}

// 端末内DBからパートごとのファイルを組み立てる(中身はここでは読み込まない)
async function buildFiles(meta, mem = []) {
  const sid = meta.sid;
  const base = meta.base || (meta.name || `video-${sid}`).replace(/\.\w+$/, '');
  const ext = meta.ext || ((meta.name || '').match(/\.(\w+)$/) || [])[1] || 'mp4';
  const type = (meta.mime || '').split(';')[0] || 'video/mp4';
  const groups = new Map();  // パート番号 -> Blob[]
  const keys = await dbDo('chunks', 'readonly', s => s.getAllKeys(rangeOf(sid))).catch(() => []);
  const legacy = keys.some(k => k.split(':').length === 2);
  const nums = [...new Set(keys.map(k => k.split(':').length === 3 ? k.split(':')[1] : '000'))].sort();
  for (const pp of nums) {
    const blobs = await dbDo('chunks', 'readonly', s => s.getAll(legacy ? rangeOf(sid) : rangeOf(`${sid}:${pp}`)));
    groups.set(pp, blobs);
  }
  for (const { key, data } of mem) {
    const pp = key.split(':')[1];
    if (!groups.has(pp)) groups.set(pp, []);
    groups.get(pp).push(data);
  }
  const all = [...groups.keys()].sort();
  return all.map((pp, i) => {
    const name = all.length > 1 ? `${base}-part${i + 1}` : base;
    return { pp, legacy, ext, type, name, file: new File(groups.get(pp), `${name}.${ext}`, { type }), idx: null };
  });
}

async function openSaveScreen(meta, mem = []) {
  busy('録画を読み込んでいます...');
  cur = meta;
  try {
    files = await buildFiles(meta, mem);
    meta.chunks = await dbDo('chunks', 'readonly', s => s.count(rangeOf(meta.sid))).catch(() => 0);
    // 区間を選べるよう、動画の目次を作る(大きな動画は少し時間がかかる)
    for (let i = 0; i < files.length; i++) {
      const label = files.length > 1 ? `(パート${i + 1}/${files.length})` : '';
      busy(`動画を調べています${label}...`);
      files[i].idx = await MP4Split.index(files[i].file, r => busy(`動画を調べています${label}... ${Math.floor(r * 100)}%`)).catch(() => null);
    }
  } catch (e) {
    files = [];
    meta.note = (meta.note ? meta.note + '\n' : '') + `読み込みに失敗しました(${e.name})`;
  }
  busy();
  renderSaveScreen(meta);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderSaveScreen(meta) {
  const total = files.reduce((a, f) => a + f.file.size, 0);
  $('msg').textContent = (meta.note ? meta.note + '\n' : '') +
    (files.length ? `${sidLabel(meta.sid)} の録画(${[fmtDur(recDuration(meta, meta.chunks)), fmtSize(total)].filter(Boolean).join('・')})` : '録画データが見つかりませんでした') +
    (meta.info ? `\n${meta.info}` : '');
  const box = $('files');
  box.replaceChildren();
  files.forEach((f, i) => box.append(f.idx ? trimBox(f, i) : wholeBox(f, i)));
  $('memoText').value = meta.memo || $('memoText').value;
  $('saveMemo').style.display = ($('memoText').value || '').trim() ? '' : 'none';
  $('saveErr').textContent = '';
  $('result').style.display = 'flex';
  $('result').scrollTop = 0;
}

// 区間を選んで保存する欄
function trimBox(f, i) {
  const idx = f.idx, last = idx.segs.length - 1;
  const div = el('div', 'fileBox');
  const q = cur.partInfo && cur.partInfo[f.pp];
  if (files.length > 1) div.append(el('div', 'name', `パート${i + 1}${q ? ` ・ ${q}` : ''}`));

  const row = (label) => {
    const r = el('label', 'rangeRow');
    const input = el('input');
    input.type = 'range'; input.min = 0; input.max = last; input.step = 1;
    const val = el('span', 'rangeVal');
    r.append(el('span', 'rangeLabel', label), input, val);
    return { r, input, val };
  };
  const a = row('開始'), z = row('終了');
  a.input.value = 0; z.input.value = last;
  // スライダーは長い動画だと細かく合わせにくいので、秒・分単位で動かすボタンも付ける
  const nudges = (target) => {
    const r = el('div', 'nudges');
    for (const [label, sec] of [['−1分', -60], ['−10秒', -10], ['−1秒', -1], ['+1秒', 1], ['+10秒', 10], ['+1分', 60]]) {
      const b = el('button', 'nudge', label);
      b.onclick = () => {
        const k = Number(target.input.value);
        const t = idx.segs[k].time + sec;
        let j = k;
        if (sec > 0) while (j < last && idx.segs[j].time < t - 0.01) j++;
        else while (j > 0 && idx.segs[j].time > t + 0.01) j--;
        if (j === k) j = Math.max(0, Math.min(last, k + Math.sign(sec)));
        target.input.value = j;
        update();
      };
      r.append(b);
    }
    return r;
  };
  const previews = el('div', 'previews');
  const pa = el('video'), pz = el('video');
  for (const v of [pa, pz]) { v.muted = true; v.playsInline = true; v.preload = 'auto'; }
  previews.append(pa, pz);
  const sel = el('div', 'sel');
  const shareBtn = el('button', 'btn', '写真アプリに保存');
  const pieces = el('div', 'pieces');
  const dlBtn = el('button', 'btn sub', 'ファイルアプリに保存');
  const prog = el('div', 'prog'); prog.hidden = true;
  const bar = el('div', 'bar'); const barIn = el('div', 'barIn'); bar.append(barIn);
  const progText = el('div', 'progText');
  prog.append(bar, progText);
  div.append(el('div', 'note', '保存したい範囲を選べます(1秒単位)。'), a.r, nudges(a), z.r, nudges(z), previews, sel, shareBtn, pieces, dlBtn, prog,
    el('div', 'note', '写真アプリ: 約300MBごとに分けて保存します。共有メニューで「ビデオを保存」を選んでください。\nファイルアプリ: 1本の動画として「ダウンロード」に保存します。'));

  const range = () => {
    let i0 = Number(a.input.value), i1 = Number(z.input.value);
    if (i0 > i1) [i0, i1] = [i1, i0];
    return [i0, i1];
  };
  // 開始・終了の位置のコマを小さく表示する(その1区切りだけを作って読み込む)
  const preview = (video, k) => {
    if (video.src) URL.revokeObjectURL(video.src);
    video.src = URL.createObjectURL(MP4Split.toFile(MP4Split.plan(idx, k, k, 'p.mp4'), f.file, f.type));
  };
  let previewTimer = null;
  const update = () => {
    const [i0, i1] = range();
    a.val.textContent = fmtTime(idx.segs[Number(a.input.value)].time);
    z.val.textContent = fmtTime(idx.segs[Number(z.input.value)].time + idx.segs[Number(z.input.value)].dur);
    let bytes = 0;
    for (let k = i0; k <= i1; k++) bytes += idx.segs[k].bytes;
    const n = Math.ceil(bytes / SHARE_LIMIT);
    sel.textContent = `選んだ範囲: ${fmtTime(idx.segs[i0].time)}〜${fmtTime(idx.segs[i1].time + idx.segs[i1].dur)}` +
      `(${fmtDur(idx.segs[i1].time + idx.segs[i1].dur - idx.segs[i0].time)}・${fmtSize(bytes)})`;
    shareBtn.textContent = n > 1 ? `写真アプリに保存(${n}個に分けて)` : '写真アプリに保存';
    shareBtn.classList.remove('done');
    pieces.replaceChildren();
    clearTimeout(previewTimer);
    previewTimer = setTimeout(() => { preview(pa, i0); preview(pz, i1); }, 300);
  };
  a.input.oninput = z.input.oninput = update;
  update();

  shareBtn.onclick = async () => {
    const [i0, i1] = range();
    const ps = MP4Split.plans(idx, i0, i1, SHARE_LIMIT, `${f.name}-${fmtTime(idx.segs[i0].time).replace(/:/g, '')}`, f.ext);
    if (ps.length === 1) {
      if (await shareFile(MP4Split.toFile(ps[0], f.file, f.type))) { shareBtn.classList.add('done'); shareBtn.textContent = '✓ 写真アプリに保存'; }
      return;
    }
    // 複数に分かれる場合は、1つずつ保存ボタンを並べる(共有メニューは1回の操作で1つしか開けないため)
    pieces.replaceChildren(el('div', 'note', `${ps.length}個に分かれます。上から順に押して、それぞれ「ビデオを保存」を選んでください。`));
    ps.forEach((p, n) => {
      const b = el('button', 'btn small', `${n + 1}/${ps.length}  ${fmtTime(p.from)}〜${fmtTime(p.to)}(${fmtSize(p.size)})`);
      b.onclick = async () => {
        if (await shareFile(MP4Split.toFile(p, f.file, f.type))) { b.classList.add('done'); b.textContent = `✓ ${b.textContent.replace(/^✓ /, '')}`; }
      };
      pieces.append(b);
    });
  };

  dlBtn.onclick = () => {
    const [i0, i1] = range();
    const p = MP4Split.plan(idx, i0, i1, `${f.name}${i0 === 0 && i1 === last ? '' : '-' + fmtTime(idx.segs[i0].time).replace(/:/g, '')}.${f.ext}`);
    startDownload(f, p, dlBtn, prog, barIn, progText);
  };
  return div;
}

// 区切りの形式でない(古い録画など)動画は、まるごと保存する
function wholeBox(f, i) {
  const div = el('div', 'fileBox');
  if (files.length > 1) div.append(el('div', 'name', `パート${i + 1} ・ ${fmtSize(f.file.size)}`));
  if (f.file.size <= SHARE_LIMIT) {
    const b = el('button', 'btn', '写真アプリに保存');
    b.onclick = async () => { if (await shareFile(f.file)) { b.classList.add('done'); b.textContent = '✓ 写真アプリに保存'; } };
    div.append(b, el('div', 'note', '共有メニューが開いたら「ビデオを保存」を選んでください。'));
  }
  const d = el('button', f.file.size <= SHARE_LIMIT ? 'btn sub' : 'btn', 'ファイルアプリに保存');
  const prog = el('div', 'prog'); prog.hidden = true;
  const bar = el('div', 'bar'); const barIn = el('div', 'barIn'); bar.append(barIn);
  const progText = el('div', 'progText');
  prog.append(bar, progText);
  d.onclick = () => startDownload(f, { name: f.file.name, size: f.file.size, items: [{ s: 0, e: f.file.size }] }, d, prog, barIn, progText);
  div.append(d, prog, el('div', 'note', (f.file.size > SHARE_LIMIT ? 'この録画は区間を選べない形式のため、まるごと保存します。\n' : '') + '「ファイル」アプリの「ダウンロード」に保存されます。'));
  return div;
}

// 写真アプリへ(共有メニュー)。共有中に二重に押せないようにする
let sharing = false;
async function shareFile(f) {
  if (sharing) return false;
  $('saveErr').textContent = '';
  if (!navigator.canShare || !navigator.canShare({ files: [f] })) {
    $('saveErr').textContent = 'このブラウザでは共有できません。「ファイルアプリに保存」を使ってください。';
    return false;
  }
  sharing = true;
  busy('共有メニューを準備しています...\n(数秒〜数十秒かかります)');
  try {
    await navigator.share({ files: [f] });
    return true;
  } catch (e) {
    if (e.name !== 'AbortError') $('saveErr').textContent = `保存できませんでした(${e.name})。範囲を短くするか、「ファイルアプリに保存」をお試しください。`;
    return false;
  } finally {
    sharing = false;
    busy();
  }
}

// ファイルアプリへ(ダウンロード)。サービスワーカーが端末内のデータを少しずつ読み出して書き出すので、
// 大きな動画でもメモリを使い切らず、進み具合もアプリ内に表示できる
const downloads = new Map();  // id -> 表示の更新
navigator.serviceWorker?.addEventListener('message', e => {
  const m = e.data;
  if (m && m.type === 'exportProgress' && downloads.has(m.id)) downloads.get(m.id)(m);
});

async function startDownload(f, p, btn, prog, barIn, progText) {
  const ctl = navigator.serviceWorker && navigator.serviceWorker.controller;
  $('saveErr').textContent = '';
  if (!ctl) {  // サービスワーカーがまだ動いていない(初めて開いた直後など)ときは、従来の方法で
    const whole = p.items.length === 1 && p.items[0].s === 0 && p.items[0].e === f.file.size;
    downloadFile(whole ? f.file : MP4Split.toFile(p, f.file, f.type));
    btn.classList.add('done');
    btn.textContent = '✓ ダウンロードを開始しました';
    return;
  }
  const id = Math.random().toString(36).slice(2);
  try {
    await new Promise((res, rej) => {
      const ch = new MessageChannel();
      ch.port1.onmessage = () => res();
      ctl.postMessage({ type: 'export', id, sid: cur.sid, pp: f.pp, legacy: f.legacy, name: p.name, size: p.size, items: p.items, mime: f.type }, [ch.port2]);
      setTimeout(() => rej(new Error('timeout')), 5000);
    });
  } catch (e) {
    $('saveErr').textContent = 'ダウンロードの準備ができませんでした。アプリを開き直してお試しください。';
    return;
  }
  btn.disabled = true;
  prog.hidden = false;
  barIn.style.width = '0%';
  progText.textContent = 'ダウンロードを始めています...';
  let started = false;
  const noStart = setTimeout(() => {
    if (started) return;
    progText.textContent = 'ダウンロードが始まりませんでした。\nホーム画面のアプリではダウンロードできないことがあります。「写真アプリに保存」(分けて保存)をお使いください。';
    btn.disabled = false;
  }, 15000);
  downloads.set(id, m => {
    started = true;
    clearTimeout(noStart);
    const pct = Math.floor(m.sent / m.total * 100);
    barIn.style.width = `${pct}%`;
    if (m.done) {
      progText.textContent = `✓ 書き出し完了(${fmtSize(m.total)})。ファイルアプリの「ダウンロード」を確認してください。`;
      btn.classList.add('done');
      btn.textContent = '✓ ファイルアプリに保存';
      btn.disabled = false;
      downloads.delete(id);
    } else if (m.error) {
      progText.textContent = `書き出しに失敗しました(${m.error})。もう一度お試しください。`;
      btn.disabled = false;
      downloads.delete(id);
    } else {
      progText.textContent = `書き出し中... ${pct}%(${fmtSize(m.sent)} / ${fmtSize(m.total)})\n完了するまでアプリを開いたままにしてください。`;
    }
  });
  // 見えない枠の中で開くと、ブラウザがダウンロードとして受け取る(このページから離れない)
  const frame = document.createElement('iframe');
  frame.style.display = 'none';
  frame.src = `export/${id}/${encodeURIComponent(p.name)}`;
  document.body.append(frame);
  setTimeout(() => frame.remove(), 60 * 60 * 1000);
}

const downloadURLs = [];
function downloadFile(f) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(f);
  a.download = f.name;
  document.body.append(a);
  a.click();
  a.remove();
  downloadURLs.push(a.href);  // 書き出しが終わるまで解放しない(削除したときに解放)
}

$('saveMemo').onclick = () => {
  const name = `${cur?.base || `memo-${stamp()}`}.txt`;
  const f = new File([$('memoText').value], name, { type: 'text/plain' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) navigator.share({ files: [f] }).catch(() => {});
  else downloadFile(f);
};

// ダウンロード中のデータを消さないよう、ダウンロード用のURLは「削除」したときだけ解放する
function leaveSaveScreen(release) {
  showHomeInfo();
  if (release) downloadURLs.splice(0).forEach(u => URL.revokeObjectURL(u));
  files = []; cur = null;
  $('files').replaceChildren();
  $('memoText').value = '';
  $('result').style.display = 'none';
  refreshStored();
}

$('deleteAndBack').onclick = async () => {
  if (!confirm('この録画を端末内から削除します。\n写真アプリ、またはファイルアプリへの保存(ダウンロード)が完了したことを確認しましたか?')) return;
  busy('削除しています...');
  try { if (cur) await deleteRecording(cur.sid); } catch (e) {}
  busy();
  leaveSaveScreen(true);
};
$('keepAndBack').onclick = () => leaveSaveScreen();
$('recAgain').onclick = () => { leaveSaveScreen(); $('recBtn').click(); };

// ---------- 端末内に残っている録画の一覧(中断された録画・まだ削除していない録画) ----------
let storedGen = 0;
async function refreshStored() {
  const gen = ++storedGen;  // 連続で呼ばれても一覧が二重にならないよう、最後の呼び出しだけ反映する
  let metas = [];
  try { metas = await dbDo('meta', 'readonly', s => s.getAll()); } catch (e) {}
  metas = (metas || []).filter(m => !session || m.sid !== session.sid).reverse();  // 新しい順
  const rows = [];
  for (const m of metas) {
    const blobs = await dbDo('chunks', 'readonly', s => s.getAll(rangeOf(m.sid))).catch(() => []);
    rows.push({ m, size: (blobs || []).reduce((a, b) => a + b.size, 0), dur: recDuration(m, (blobs || []).length) });
  }
  if (gen !== storedGen) return;
  const list = $('storedList');
  list.replaceChildren();
  $('stored').hidden = !rows.length;
  for (const { m, size, dur } of rows) {
    const row = document.createElement('div');
    row.className = 'srow';
    const label = document.createElement('span');
    label.textContent = [sidLabel(m.sid), fmtDur(dur), fmtSize(size)].filter(Boolean).join(' ・ ');
    const save = document.createElement('button');
    save.className = 'btn small';
    save.textContent = '保存';
    save.disabled = !size;
    save.onclick = () => openSaveScreen(m);
    const del = document.createElement('button');
    del.className = 'btn small sub';
    del.textContent = '削除';
    del.onclick = async () => {
      if (!confirm(`${sidLabel(m.sid)} の録画を削除します。保存していない場合は元に戻せません。`)) return;
      await deleteRecording(m.sid).catch(() => {});
      refreshStored();
    };
    row.append(label, save, del);
    list.append(row);
  }
}
refreshStored();
