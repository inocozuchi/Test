<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>無音カメラ</title>
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #fff; color: #000; overflow: hidden;
    font-family: -apple-system, sans-serif; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #home { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 16px; text-align: center; }
  #info { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 0; right: 0; font-size: 13px; color: #888; }
  #recBtn { width: 96px; height: 96px; border-radius: 50%; border: 0; background: #000; padding: 0; }
  #recBtn:disabled { background: #bbb; }
  .btn { border: 0; border-radius: 999px; font-size: 15px; color: #fff; background: #000; padding: 12px 18px; }
  #err { color: #c22; font-size: 13px; }
  #leftover { background: #fee; padding: 12px; border-radius: 8px; font-size: 13px; }
  #leftoverBtn { margin-top: 8px; background: #c52; }

  /* 録画中の真っ黒画面 */
  #black { position: fixed; inset: 0; background: #000; display: none; z-index: 10; }
  #tapHint { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); color: #222; font-size: 14px; opacity: 0; transition: opacity .3s; }

  /* メモ画面(白背景) */
  #memo { position: fixed; inset: 0; background: #fff; color: #000; display: none; z-index: 20;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px);
    flex-direction: column; gap: 8px; -webkit-user-select: text; user-select: text; }
  #memo header { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #555; }
  #memoText { flex: 1; width: 100%; font-size: 17px; border: 1px solid #ccc; border-radius: 8px; padding: 10px; color: #000; background: #fff; resize: none; }

  /* 保存画面 */
  #result { position: fixed; inset: 0; background: #fff; display: none; z-index: 30; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; }
  #result .btn { width: 100%; max-width: 320px; }
  #result .btn.sub { background: #888; }
  #msg { font-size: 14px; color: #444; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="home">
  <div id="info">カメラ準備中...</div>
  <div id="leftover" hidden>
    中断された録画が残っています<br><button class="btn" id="leftoverBtn">保存する</button>
  </div>
  <button id="recBtn" aria-label="録画開始" disabled></button>
  <div id="err"></div>
  <button class="btn" id="retry" hidden>カメラを再起動</button>
</div>

<div id="black"><div id="tapHint"></div></div>

<div id="memo">
  <header><span>メモ(録画は継続中)</span>
    <button class="btn" id="memoBack">戻る</button></header>
  <textarea id="memoText" placeholder="メモを入力"></textarea>
</div>

<div id="result">
  <div id="msg"></div>
  <button class="btn" id="saveVideo">動画を保存</button>
  <button class="btn" id="saveMemo">メモを保存</button>
  <button class="btn sub" id="closeResult">カメラに戻る</button>
</div>

<script>
const $ = id => document.getElementById(id);
let stream = null;
let rec = null, cur = null, memChunks = [], recordedFile = null;
let wakeLock = null;

// ---------- カメラ(プレビューは表示しない) ----------
const CANDIDATES = [[3840, 2160, 60], [3840, 2160, 30], [1920, 1080, 60], [1920, 1080, 30], [1280, 720, 30]];

function fmtSettings() {
  const s = stream.getVideoTracks()[0].getSettings();
  return { w: s.width, h: s.height, fps: Math.round(s.frameRate || 0) };
}

// 4K60から順に試し、使える最高の設定を採用する
async function applyBestQuality() {
  const track = stream.getVideoTracks()[0];
  let best = null;
  for (const [w, h, fps] of CANDIDATES) {
    try {
      await track.applyConstraints({ width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: fps } });
    } catch (e) { continue; }
    const s = fmtSettings();
    if (Math.max(s.w, s.h) >= w && s.fps >= fps - 1) return;
    if (!best || s.w * s.h * s.fps > best.w * best.h * best.fps) best = { ...s, w, h, fps };
  }
}

async function startCamera() {
  $('err').textContent = '';
  $('retry').hidden = true;
  $('recBtn').disabled = true;
  $('info').textContent = 'カメラ準備中...';
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 }, frameRate: { ideal: 60 } },
      audio: false,
    });
    await applyBestQuality();
    const s = fmtSettings();
    $('info').textContent = `${Math.max(s.w, s.h)}×${Math.min(s.w, s.h)} ${s.fps}fps`;
    $('recBtn').disabled = false;
  } catch (e) {
    $('info').textContent = '';
    $('err').textContent = `カメラを起動できません: ${e.name} ${e.message}`;
    $('retry').hidden = false;
  }
}
$('retry').onclick = startCamera;
startCamera();

// ---------- 保存(iPhoneは共有シートから「保存」) ----------
async function saveFiles(files) {
  try {
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files });
      return true;
    }
  } catch (e) {
    if (e.name === 'AbortError') return false;
  }
  for (const f of files) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f); a.download = f.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  return true;
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

// ---------- 録画データの保存先(端末内DB) ----------
// 1秒ごとに書き込むので、アプリが落ちても次回起動時にそこまでの録画を復元できる。
const dbReady = new Promise((res, rej) => {
  const r = indexedDB.open('silentcam', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('chunks'); r.result.createObjectStore('meta'); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});

async function dbDo(store, mode, fn) {
  const db = await dbReady;
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result);
    t.onerror = t.onabort = () => rej(t.error);
  });
}

const chunkRange = sid => IDBKeyRange.bound(`${sid}:`, `${sid}:￿`);

// ---------- 録画 ----------
function bitrate() {
  const s = fmtSettings();
  return Math.min(60e6, Math.round(s.w * s.h * s.fps * 0.1));
}

$('recBtn').onclick = async () => {
  const mime = ['video/mp4;codecs=hvc1', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';
  const ext = mime.includes('webm') ? 'webm' : 'mp4';
  const sid = stamp();
  const s = fmtSettings();
  rec = new MediaRecorder(stream, { mimeType: mime || undefined, videoBitsPerSecond: bitrate() });
  cur = { sid, name: `video-${sid}.${ext}`, mime: rec.mimeType || mime, memo: '',
          info: `${Math.max(s.w, s.h)}×${Math.min(s.w, s.h)} ${s.fps}fps` };
  memChunks = [];
  let idx = 0, useMem = false, chain = dbDo('meta', 'readwrite', st => st.put(cur, sid)).catch(() => { useMem = true; });
  rec.ondataavailable = e => {
    if (!e.data.size) return;
    const key = `${sid}:${String(idx++).padStart(8, '0')}`;
    chain = chain.then(() => useMem ? memChunks.push(e.data)
      : dbDo('chunks', 'readwrite', st => st.put(e.data, key)).catch(() => { useMem = true; memChunks.push(e.data); }));
  };
  rec.onstop = async () => {
    await chain;
    recordedFile = await buildFile();
    showResult();
    // 停止直後ならそのまま共有シートを開く(iOSが許可しない場合は保存ボタンから)
    if (!document.hidden && navigator.canShare && navigator.canShare({ files: [recordedFile] })) {
      navigator.share({ files: [recordedFile] }).catch(() => {});
    }
  };
  rec.start(1000);
  $('memoText').value = '';
  enterBlack();
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
};

function stopRecording() {
  if (!rec || rec.state === 'inactive') return;
  rec.stop();
  $('black').style.display = 'none';
  $('memo').style.display = 'none';
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

// アプリを離れるとiOSがカメラを止めるので、それまでの分を確定させる
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopRecording();
  else if (!rec || rec.state === 'inactive') { if (!stream || stream.getTracks().some(t => t.readyState === 'ended')) startCamera(); }
  else if (wakeLock === null && rec && rec.state === 'recording') navigator.wakeLock?.request('screen').then(l => wakeLock = l).catch(() => {});
});

window.addEventListener('pagehide', stopRecording);

// ---------- 真っ黒画面: 5回タップでメモ / 10回タップで停止 ----------
let taps = 0, tapTimer = null, hintTimer = null;

function enterBlack() {
  $('memo').style.display = 'none';
  $('black').style.display = 'block';
}

$('black').addEventListener('pointerdown', e => {
  e.preventDefault();
  taps++;
  const hint = $('tapHint');
  hint.textContent = taps;
  hint.style.opacity = 1;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.style.opacity = 0, 600);
  clearTimeout(tapTimer);
  if (taps >= 10) { taps = 0; stopRecording(); return; }
  // 連続タップが途切れてから判定(10回の途中で5回目に反応しないように)
  tapTimer = setTimeout(() => {
    if (taps >= 5) openMemo();
    taps = 0;
  }, 800);
});

function openMemo() {
  $('black').style.display = 'none';
  $('memo').style.display = 'flex';
  const t = $('memoText');
  t.focus();
  t.setSelectionRange(t.value.length, t.value.length);
}

$('memoBack').onclick = () => { $('memoText').blur(); enterBlack(); };

// メモは入力のたびに端末内へ保存(アプリが落ちても残る)
let memoTimer = null;
$('memoText').addEventListener('input', () => {
  if (!cur) return;
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => {
    cur.memo = $('memoText').value;
    dbDo('meta', 'readwrite', s => s.put(cur, cur.sid)).catch(() => {});
  }, 400);
});

// ---------- 録画後 ----------
async function buildFile() {
  const chunks = await dbDo('chunks', 'readonly', s => s.getAll(chunkRange(cur.sid))).catch(() => []);
  return new File([...(chunks || []), ...memChunks], cur.name, { type: cur.mime.split(';')[0] || 'video/mp4' });
}

function showResult() {
  const mb = (recordedFile.size / 1e6).toFixed(1);
  $('msg').textContent = `録画を端末内に確保しました(${mb} MB)\n${cur.info || ''}\n\n下のボタンから「ビデオを保存」を選ぶと、写真アプリの「ビデオ」に入ります。`;
  $('saveMemo').style.display = ($('memoText').value || '').trim() ? '' : 'none';
  $('result').style.display = 'flex';
}

$('saveVideo').onclick = () => saveFiles([recordedFile]);
$('saveMemo').onclick = () => saveFiles([new File([$('memoText').value], cur.name.replace(/\.\w+$/, '.txt'), { type: 'text/plain' })]);
$('closeResult').onclick = async () => {
  if (!confirm('保存していない動画は消えます。カメラに戻りますか?')) return;
  await dbDo('chunks', 'readwrite', s => s.delete(chunkRange(cur.sid))).catch(() => {});
  await dbDo('meta', 'readwrite', s => s.delete(cur.sid)).catch(() => {});
  recordedFile = null; cur = null; memChunks = [];
  $('memoText').value = '';
  $('result').style.display = 'none';
  checkLeftover();
  if (!stream || stream.getTracks().some(t => t.readyState === 'ended')) startCamera();
};

// ---------- 前回の録画が残っていたら復元 ----------
async function checkLeftover() {
  const box = $('leftover');
  box.hidden = true;
  let metas = [];
  try { metas = await dbDo('meta', 'readonly', s => s.getAll()); } catch (e) {}
  if (!metas || !metas.length) return;
  const m = metas[metas.length - 1];
  box.hidden = false;
  $('leftoverBtn').onclick = async () => {
    cur = m; memChunks = [];
    recordedFile = await buildFile();
    $('memoText').value = m.memo || '';
    showResult();
  };
}
checkLeftover();
</script>
</body>
</html>
